name: Check Deployed Pages 🔍

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to test"
        required: false
        default: "https://kanggara.my.id"
  schedule:
    # Run daily at 00:00 UTC to ensure live site integrity
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  healthcheck:
    name: Verify Deployment
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Run deployment healthcheck
        run: |
          chmod +x test.sh
          ./test.sh "${{ inputs.target_url || 'https://kanggara.my.id' }}"
