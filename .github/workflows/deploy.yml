name: Deploy Pages 🚀

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      asset_hash: ${{ steps.bundle-info.outputs.asset_hash }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
      - name: Install dependencies
        run: bun install
      - name: Compose Markdown index
        run: |
          chmod +x run.sh
          ./run.sh
      - name: Build
        run: bun run build
      - name: Extract bundle metadata
        id: bundle-info
        run: |
          ENTRY_JS=$(grep -o 'src="/assets/[^"]*"' dist/index.html | head -n 1 | sed 's/src="//;s/"//' || true)
          echo "asset_hash=$ENTRY_JS" >> "$GITHUB_OUTPUT"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  test:
    environment:
      name: testing
    runs-on: ubuntu-24.04
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Run deployment healthcheck
        env:
          EXPECTED_ASSET: ${{ needs.deploy.outputs.asset_hash }}
        run: |
          chmod +x test.sh
          ./test.sh "${{ needs.deploy.outputs.page_url }}"
